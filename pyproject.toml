[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:libtorrent",
    "ignore:add_files is deprecated",
    "ignore:create_torrent constructor from file_storage is deprecated",
    "ignore:piece_priorities\\(\\) is deprecated",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["torrent-fish.py"]

[tool.black]
line-length = 88
