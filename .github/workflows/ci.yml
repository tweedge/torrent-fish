name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libtorrent and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtorrent-rasterbar-dev libboost-system-dev libssl-dev \
            pkg-config build-essential cmake

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Install python libtorrent for the wire-level integration test
        run: |
          python3 -m pip install --user libtorrent

      - name: Test
        # The integration test uses a python libtorrent peer over the loopback to
        # prove metadata is served on the wire; it self-skips if unavailable.
        run: cargo test --release --locked -- --test-threads=1

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: torrent-fish-linux-amd64
          path: target/release/torrent-fish
          if-no-files-found: error
