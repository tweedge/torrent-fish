name: docker

# Builds the container image, verifies behavior (serves metadata, downloads no
# payload), emits a security SBOM, and publishes to Docker Hub on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libtorrent and build dependencies
        # Needed to build the host binary used as the metadata-fetching peer.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtorrent-rasterbar-dev libboost-system-dev libssl-dev \
            pkg-config build-essential cmake

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build host binary (magnet-peer probe + fixture check)
        run: cargo build --release --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build distroless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: torrent-fish:distroless
          cache-from: type=gha,scope=distroless
          cache-to: type=gha,mode=max,scope=distroless

      - name: Build scratch image (static musl)
        id: scratch
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.scratch
          load: true
          tags: torrent-fish:scratch
          cache-from: type=gha,scope=scratch
          cache-to: type=gha,mode=max,scope=scratch

      - name: Verify behavior — distroless (serves metadata, no payload)
        run: ./scripts/verify-container.sh torrent-fish:distroless ./target/release/torrent-fish 17801 /home/nonroot

      - name: Verify behavior — scratch (serves metadata, no payload)
        if: always()
        run: ./scripts/verify-container.sh torrent-fish:scratch ./target/release/torrent-fish 17803 /tmp

      - name: Report scratch build status
        if: always()
        run: |
          if [ "${{ steps.scratch.outcome }}" != "success" ]; then
            echo ">:warning: scratch (static musl) image build did not complete; \`latest\` remains distroless." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Security-relevant: emit an SBOM for the shipped (distroless) image.
      - name: Generate SBOM (distroless)
        uses: anchore/sbom-action@v0
        with:
          image: torrent-fish:distroless
          format: spdx-json
          artifact-name: torrent-fish-distroless.spdx.json
          output-file: torrent-fish-distroless.spdx.json

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push multi-arch distroless image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: tweedge/torrent-fish:latest
          cache-from: type=gha,scope=distroless
          cache-to: type=gha,mode=max,scope=distroless

      - name: Update Docker Hub description
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: tweedge/torrent-fish
          readme-filepath: ./README.md
