name: docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build and test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: torrent-fish:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      # torrent-fish exits non-zero when the load path has no torrents, so use a
      # real torrent with a short-lived session and assert it starts serving.
      - name: Create a test torrent
        run: |
          pip install libtorrent==2.1.1
          mkdir -p test-torrents content client
          printf 'torrent-fish docker smoke test\n' > content/hello.txt
          python3 - <<'PY'
          import libtorrent as lt
          fs = lt.file_storage()
          lt.add_files(fs, "content")
          torrent = lt.create_torrent(fs, piece_size=16384)
          lt.set_piece_hashes(torrent, ".")
          open("test-torrents/test.torrent", "wb").write(lt.bencode(torrent.generate()))
          PY

      - name: Run container and verify it starts
        run: |
          docker run -d --name fish \
            -v "$PWD/test-torrents:/opt/torrents:ro" \
            -p 6881:6881 \
            torrent-fish:test -l /opt/torrents -s /home/nonroot
          for i in $(seq 1 20); do
            if docker logs fish 2>&1 | grep -q "Adding /opt/torrents/test.torrent"; then
              break
            fi
            sleep 1
          done
          docker logs fish
          docker logs fish 2>&1 | grep -q "Adding /opt/torrents/test.torrent"

          test -z "$(docker ps -q --filter name=fish --filter status=exited)" \
            || { echo "container exited unexpectedly"; docker logs fish; exit 1; }

      - name: Verify the image serves torrent metadata
        run: |
          python3 - <<'PY'
          import sys, time
          import libtorrent as lt

          ti = lt.torrent_info("test-torrents/test.torrent")
          magnet = lt.make_magnet_uri(ti)

          ses = lt.session({
              "listen_interfaces": "127.0.0.1:0",
              "enable_dht": False,
              "enable_lsd": False,
              "enable_upnp": False,
              "enable_natpmp": False,
          })
          atp = lt.parse_magnet_uri(magnet)
          atp.save_path = "client"
          atp.peers = [("127.0.0.1", 6881)]
          handle = ses.add_torrent(atp)

          deadline = time.time() + 30
          while time.time() < deadline:
              if handle.status().has_metadata:
                  print("metadata received from containerized torrent-fish")
                  sys.exit(0)
              time.sleep(0.2)
          print("FAILED: no metadata received from container", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Confirm the container is not running as root
        run: |
          # distroless has no shell or `id`, so read the configured user from the
          # image metadata instead of executing a command in the container.
          USER_SPEC=$(docker inspect --format '{{.Config.User}}' torrent-fish:test)
          echo "configured user: '$USER_SPEC'"
          case "$USER_SPEC" in
            nonroot*|65532*) ;;
            *) echo "image does not run as nonroot"; exit 1 ;;
          esac

      - name: Stop container
        if: always()
        run: docker rm -f fish || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: tweedge/torrent-fish:latest
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
