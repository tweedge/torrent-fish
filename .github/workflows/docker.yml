name: docker

# Builds the container image, verifies behavior (serves metadata, downloads no
# payload), measures size + dependency count + runtime RAM, and publishes to
# Docker Hub on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: build, verify, measure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (drive a real magnet peer)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Syft (dependency/SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install python libtorrent
        run: python -m pip install libtorrent

      - name: Build distroless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: torrent-fish:distroless
          cache-from: type=gha,scope=distroless
          cache-to: type=gha,mode=max,scope=distroless

      - name: Build scratch image (static musl)
        id: scratch
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.scratch
          load: true
          tags: torrent-fish:scratch
          cache-from: type=gha,scope=scratch
          cache-to: type=gha,mode=max,scope=scratch

      - name: Create a test torrent
        run: |
          mkdir -p test-torrents content client
          printf 'torrent-fish measurement payload\n' > content/hello.txt
          python - <<'PY'
          import libtorrent as lt
          fs = lt.file_storage(); lt.add_files(fs, "content")
          ct = lt.create_torrent(fs, piece_size=16384); lt.set_piece_hashes(ct, ".")
          open("test-torrents/test.torrent", "wb").write(lt.bencode(ct.generate()))
          PY

      - name: Verify behavior — serves metadata, downloads no payload
        run: |
          set -euo pipefail
          # distroless has no shell; run metrics mode (serves, then prints METRIC
          # lines and exits) and drive a real magnet peer meanwhile.
          docker run --rm --network host \
            -v "$PWD/test-torrents:/opt/torrents:ro" \
            -e TF_METRICS=1 -e TF_METRICS_SECS=6 \
            torrent-fish:distroless -l /opt/torrents -s /home/nonroot -p 17801 \
            > /tmp/metrics.txt 2>&1 &
          FISH_PID=$!
          sleep 2
          python - "$PWD/test-torrents/test.torrent" 17801 <<'PY'
          import sys, time, libtorrent as lt
          tf, port = sys.argv[1], int(sys.argv[2])
          ti = lt.torrent_info(tf)
          ses = lt.session({"listen_interfaces":"127.0.0.1:0","enable_dht":False,"enable_lsd":False,"enable_upnp":False,"enable_natpmp":False})
          atp = lt.parse_magnet_uri(lt.make_magnet_uri(ti)); atp.save_path="/tmp/client"; atp.peers=[("127.0.0.1",port)]
          h = ses.add_torrent(atp)
          end = time.time()+20
          while time.time() < end:
              if h.status().has_metadata:
                  print("METADATA_SERVED_OK"); sys.exit(0)
              time.sleep(0.2)
          print("METADATA_NOT_SERVED", file=sys.stderr); sys.exit(1)
          PY
          wait $FISH_PID || true
          cat /tmp/metrics.txt
          grep -q "METRIC total_payload_download=0" /tmp/metrics.txt
          grep -q "METRIC total_wanted=0" /tmp/metrics.txt
          grep -q "METRIC upload_mode=1" /tmp/metrics.txt
          grep -q "METRIC auto_managed=0" /tmp/metrics.txt
          grep -q "METRIC has_metadata=1" /tmp/metrics.txt
          echo "verified: metadata served; zero payload downloaded"

      - name: Confirm non-root and measure images
        run: |
          R="${GITHUB_STEP_SUMMARY}"
          USER_SPEC=$(docker inspect --format '{{.Config.User}}' torrent-fish:distroless)
          echo "configured user: '$USER_SPEC'"
          case "$USER_SPEC" in nonroot*|65532*) ;; *) echo "not nonroot"; exit 1;; esac

          echo "## Container measurement" >> "$R"; echo "" >> "$R"
          echo "| image | unpacked | packages (syft) |" >> "$R"
          echo "|---|---|---|" >> "$R"
          measure() {
            local tag="$1"
            if ! docker image inspect "$tag" >/dev/null 2>&1; then
              echo "| $tag | (build skipped/failed) | - |" >> "$R"; return
            fi
            local size pkgs mb
            size=$(docker image inspect "$tag" -f '{{.Size}}')
            pkgs=$(syft "$tag" -o json 2>/dev/null | python -c 'import sys,json;print(len(json.load(sys.stdin)["artifacts"]))' 2>/dev/null || echo n/a)
            mb=$(awk "BEGIN{printf \"%.1f\", $size/1e6}")
            echo "| $tag | ${mb} MB | $pkgs |" >> "$R"
          }
          measure torrent-fish:distroless || true
          measure torrent-fish:scratch || true

          echo "" >> "$R"
          echo "<details><summary>distroless packages (syft)</summary>" >> "$R"; echo "" >> "$R"
          echo '```' >> "$R"
          syft torrent-fish:distroless -o list 2>/dev/null | head -100 >> "$R" || true
          echo '```' >> "$R"; echo "</details>" >> "$R"

          echo "### Behavior" >> "$R"; echo "" >> "$R"; echo '```' >> "$R"
          cat /tmp/metrics.txt >> "$R" || true; echo '```' >> "$R"

      - name: Measure runtime RAM while serving
        run: |
          set -euo pipefail
          docker run -d --name fish-ram --network host \
            -v "$PWD/test-torrents:/opt/torrents:ro" \
            -e TF_METRICS=1 -e TF_METRICS_SECS=30 \
            torrent-fish:distroless -l /opt/torrents -s /home/nonroot -p 17802
          sleep 3
          python - "$PWD/test-torrents/test.torrent" 17802 <<'PY' || true
          import sys, time, libtorrent as lt
          tf, port = sys.argv[1], int(sys.argv[2])
          ti = lt.torrent_info(tf)
          ses = lt.session({"listen_interfaces":"127.0.0.1:0","enable_dht":False,"enable_lsd":False,"enable_upnp":False,"enable_natpmp":False})
          atp = lt.parse_magnet_uri(lt.make_magnet_uri(ti)); atp.save_path="/tmp/client"; atp.peers=[("127.0.0.1",port)]
          h = ses.add_torrent(atp)
          end = time.time()+8
          while time.time() < end and not h.status().has_metadata: time.sleep(0.2)
          time.sleep(2)
          PY
          CID=$(docker ps -q --filter name=fish-ram)
          MEM=$(docker stats --no-stream --format '{{.MemUsage}}' "$CID")
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "distroless memory usage while serving: **$MEM**" >> "$GITHUB_STEP_SUMMARY"
          echo "memory: $MEM"
          docker rm -f fish-ram || true

      - name: Report scratch build status
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scratch.outcome }}" = "success" ]; then
            echo "scratch (static musl) image built successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "scratch (static musl) image build did **not** complete; see the build log. \`latest\` remains distroless." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push multi-arch distroless image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: tweedge/torrent-fish:latest
          cache-from: type=gha,scope=distroless
          cache-to: type=gha,mode=max,scope=distroless

      - name: Update Docker Hub description
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: tweedge/torrent-fish
          readme-filepath: ./README.md
